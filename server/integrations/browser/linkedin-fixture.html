<!doctype html>
<!-- A LinkedIn job page with an Easy Apply form in pages, built like the live one (generated class names left
     out): a dialog-content box, labels tied to inputs, Yes/No radio groups labelled by their question, a
     resume upload, Next until Review, then "Submit application". -->
<html>
<head><meta charset="utf-8"><title>Senior Software Engineer | Acme | LinkedIn</title></head>
<body>
  <main>
    <h2>Acme</h2>
    <p>United States · 2 hours ago · 45 applicants</p>
    <button type="button" aria-label="Easy Apply to this job" onclick="openForm()">Easy Apply</button>
    <h2>About the job</h2>
    <p>Build things.</p>
  </main>
  <div id="host"></div>
  <script>
    const pages = [
      `<p>1/3 pages</p><p>Contact info</p>
       <label for="email">Email address*</label><select id="email" required><option value=""></option><option value="a" selected>ada@example.test</option></select>
       <label for="phone">Mobile phone number*</label><input id="phone" type="tel" required value="7045550100">`,
      `<p>2/3 pages</p><p>Resume*</p>
       <div id="files">Old_Resume.pdf</div>
       <input type="file" id="upload" onchange="document.getElementById('files').textContent = this.files[0].name">`,
      `<p>3/3 pages</p><p>Additional Questions</p>
       <span id="q1">Are you legally authorized to work in the United States?*</span>
       <div role="radiogroup" aria-labelledby="q1">
         <input type="radio" name="g1" id="g1y"><label for="g1y">Yes</label>
         <input type="radio" name="g1" id="g1n"><label for="g1n">No</label>
       </div>
       <label for="years">How many years of work experience do you have with TypeScript?*</label>
       <input id="years" type="text" required>
       <label for="py">How many years of work experience do you have with Python?*</label>
       <input id="py" type="text" required value="3">
       <!-- LinkedIn's current choices: each radio hidden, its aria-label the question, its label empty, its text in a
            <p> beside it; the question just outside the radiogroup. -->
       <div>
         <span>Proven experience designing, developing, and maintaining backend software in production environments;*</span>
         <fieldset role="radiogroup" aria-describedby="error-message-_r_30_">
           <div><div><input type="radio" name="radio-group-_r_30_" id="_r_32_" aria-label="Proven experience designing, developing, and maintaining backend software in production environments;" style="opacity:0;width:0;height:0;margin:0"><label for="_r_32_" style="display:inline-block;width:24px;height:20px;border:1px solid"></label></div><div><p>Yes</p></div></div>
           <div><div><input type="radio" name="radio-group-_r_30_" id="_r_34_" aria-label="Proven experience designing, developing, and maintaining backend software in production environments;" style="opacity:0;width:0;height:0;margin:0"><label for="_r_34_" style="display:inline-block;width:24px;height:20px;border:1px solid"></label></div><div><p>No</p></div></div>
         </fieldset>
       </div>
       <div>
         <p>Gender</p>
         <p>We are an equal opportunity employer.</p>
         <fieldset role="radiogroup">
           <div><div><input type="radio" name="radio-group-_r_2p_" id="_r_2r_" aria-label="Gender" style="opacity:0;width:0;height:0;margin:0"><label for="_r_2r_" style="display:inline-block;width:24px;height:20px;border:1px solid"></label></div><div><p>Male</p></div></div>
           <div><div><input type="radio" name="radio-group-_r_2p_" id="_r_2t_" aria-label="Gender" style="opacity:0;width:0;height:0;margin:0"><label for="_r_2t_" style="display:inline-block;width:24px;height:20px;border:1px solid"></label></div><div><p>Female</p></div></div>
           <div><div><input type="radio" name="radio-group-_r_2p_" id="_r_2v_" aria-label="Gender" style="opacity:0;width:0;height:0;margin:0" checked><label for="_r_2v_" style="display:inline-block;width:24px;height:20px;border:1px solid"></label></div><div><p>I don't wish to answer</p></div></div>
         </fieldset>
       </div>
       <div id="errors"></div>`,
    ];
    let at = 0;
    function render() {
      const host = document.getElementById("host");
      if (at === pages.length) {
        host.innerHTML = `<div role="dialog"><div data-testid="dialog-content"><p>Review your application</p>
          <button type="button" onclick="sent()">Submit application</button></div></div>`;
        return;
      }
      host.innerHTML = `<dialog open><button type="button" aria-label="Dismiss" onclick="ask()">x</button><div data-testid="dialog-content">${pages[at]}
        <button type="button" onclick="next()">${at === pages.length - 1 ? "Review" : "Next"}</button></div></dialog>`;
    }
    function openForm() { at = 0; render(); }
    // Closing asks whether to save the application; Discard keeps nothing.
    function ask() {
      document.getElementById("host").innerHTML = `<div role="alertdialog"><p>Save this application?</p>
        <button type="button" onclick="document.getElementById('host').innerHTML = ''">Discard</button><button type="button">Save</button></div>`;
    }
    function next() {
      if (at === 2) {
        const ok = document.querySelector("input[name=g1]:checked") && document.getElementById("years").value.trim();
        if (!ok) { document.getElementById("errors").innerHTML = '<div role="alert">This field is required</div>'; return; }
      }
      at++;
      render();
    }
    function sent() { document.getElementById("host").innerHTML = '<div role="dialog"><p>Your application was sent to Acme</p></div>'; }
  </script>
</body>
</html>
