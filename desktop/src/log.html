<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Jobrx runner log</title>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --fg: #18181b; --muted: #71717a; --border: #e4e4e7; }
    @media (prefers-color-scheme: dark) { :root { --bg: #18181b; --fg: #e4e4e7; --muted: #a1a1aa; --border: #3f3f46; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; height: 100vh; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--border); }
    header span { color: var(--muted); }
    a { color: inherit; cursor: pointer; text-decoration: underline; }
    pre { flex: 1; margin: 0; padding: 10px 14px; overflow: auto; font: 12px/1.5 ui-monospace, "SF Mono", Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <header>
    <span>What the runner is doing on this computer</span>
    <a id="open">Open Jobrx</a>
  </header>
  <pre id="log"></pre>
  <script>
    const pre = document.getElementById("log");
    const add = (line) => {
      // Stays at the bottom unless you scrolled up to read.
      const atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20;
      pre.append(line + "\n");
      if (atEnd) pre.scrollTop = pre.scrollHeight;
    };
    window.jobrx.log().then((lines) => {
      lines.forEach(add);
      pre.scrollTop = pre.scrollHeight;
    });
    window.jobrx.onLog(add);
    document.getElementById("open").addEventListener("click", () => window.jobrx.openApp("/app/applying"));
  </script>
</body>
</html>
