<!-- The password reset email (Supabase Auth's "Reset password" template). Paste it into the dashboard
     (Authentication > Emails > Reset password) with the subject "Reset your Jobrx password"; config.toml uses it
     for the local stack. {{ .ConfirmationURL }} is the one-time link Supabase fills in. -->
<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f4f4f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#18181b">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f7;padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;padding:32px">
            <tr>
              <td>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="width:40px;height:40px;background:#6366f1;border-radius:10px;color:#ffffff;font-weight:700;font-size:16px;text-align:center;vertical-align:middle">Rx</td>
                    <td style="padding-left:10px;font-weight:600;font-size:18px">Jobrx</td>
                  </tr>
                </table>
                <h1 style="font-size:20px;line-height:28px;margin:28px 0 8px">Reset your password</h1>
                <p style="font-size:15px;line-height:22px;margin:0 0 24px;color:#3f3f46">
                  Someone asked to reset the password for your Jobrx account. If it was you, choose a new one:
                </p>
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#6366f1;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:12px 20px;border-radius:8px">Choose a new password</a>
                <p style="font-size:13px;line-height:20px;margin:24px 0 0;color:#71717a">
                  The link works once and expires in an hour. If you didn't ask for this, ignore this email; your password stays as it is.
                </p>
              </td>
            </tr>
          </table>
          <p style="font-size:12px;color:#a1a1aa;margin:16px 0 0">Jobrx · jobrx.ai</p>
        </td>
      </tr>
    </table>
  </body>
</html>
